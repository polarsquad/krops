# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: air-gapped

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-gapped-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build air-gap bundle
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    services:
      registry:
        image: registry:3
        ports:
          - 5001:5000
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:5000/v2/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install mise
        uses: jdx/mise-action@v5.2.1
        with:
          version: 2026.10.17
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build air-gap bundle
        run: airgap/scripts/build-package.sh
        env:
          AIRGAP_CLUSTER_NAME: airgap-wl
          OCI_REGISTRY: localhost:5001
          WORKLOAD_REGISTRY_HOST: krops-registry-airgap
          ZARF_KEYLESS_SIGNING: "1"
          KROPS_DEPENDENCY_GRAPH_GIT_REF: ${{ github.ref }}
          KROPS_DEPENDENCY_GRAPH_WORKFLOW_REF: ${{ github.workflow_ref }}

      - name: Store air-gap package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krops-airgap-arm64-package
          path: airgap/zarf-package-krops-airgap-*.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Store air-gap bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krops-airgap-arm64
          path: |
            airgap/archives/
            airgap/config-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The dependency graph record (#606) outlives the throwaway nightly
      # package: it is a few KB and retained 30 days for offline inspection
      # of what a given package version contains.
      - name: Store air-gap dependency graph
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krops-airgap-dependency-graph
          path: airgap/dependency-graph.json
          if-no-files-found: error
          retention-days: 30

  isolated-deploy:
    name: Deploy without external egress
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # See docs/airgap.md for why (nested node containers exhaust the default host inotify limits).
      - name: Raise inotify limits for nested node containers
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=524288
          sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Install mise
        uses: jdx/mise-action@v5.2.1
        with:
          version: 2026.10.17
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download air-gap package
        uses: actions/download-artifact@v8.0.2
        with:
          name: krops-airgap-arm64-package
          path: airgap

      - name: Download air-gap bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: krops-airgap-arm64
          path: airgap

      - name: Deploy with external egress blocked
        env:
          SKIP_OFFLINE_CHECK: "1"
          AIRGAP_VERIFY_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -uo pipefail

          capture=/tmp/airgap-public-egress.pcap
          dns_probe=/tmp/airgap-dns-probe.txt
          firewall_comment=krops-airgap-egress
          dns_comment=krops-airgap-dns
          bridge_interface=
          tcpdump_pid=
          dns_block_installed=0

          stop_capture() {
            if [ -n "$tcpdump_pid" ]; then
              sudo kill "$tcpdump_pid" 2>/dev/null || true
              wait "$tcpdump_pid" 2>/dev/null || true
              tcpdump_pid=
            fi
          }
          # External DNS is blocked at the host OUTPUT chain, because the DNS
          # path from the kind network never crosses the kind bridge:
          # containers resolve through Docker's built-in DNS (127.0.0.11),
          # and dockerd forwards unknown names to the host's upstream
          # resolvers from the host network namespace (the egress rule and
          # the pcap below never see it). Only non-loopback destinations are
          # dropped. See docs/airgap.md (DNS in the gap). The block is
          # lifted on step exit, before the evidence upload: the runner
          # agent needs DNS for it.
          remove_dns_block() {
            if [ "$dns_block_installed" = "1" ]; then
              sudo iptables -D OUTPUT -p udp --dport 53 ! -d 127.0.0.0/8 \
                -m comment --comment "$dns_comment" -j DROP 2>/dev/null || true
              sudo iptables -D OUTPUT -p tcp --dport 53 ! -d 127.0.0.0/8 \
                -m comment --comment "$dns_comment" -j DROP 2>/dev/null || true
              dns_block_installed=0
            fi
          }
          cleanup() {
            remove_dns_block
            stop_capture
            if [ -n "$bridge_interface" ]; then
              sudo iptables -D DOCKER-USER \
                -i "$bridge_interface" ! -o "$bridge_interface" \
                -m conntrack --ctstate NEW \
                -m comment --comment "$firewall_comment" -j DROP \
                2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          docker network inspect kind >/dev/null 2>&1 || \
            docker network create kind >/dev/null
          network_id=$(docker network inspect kind --format '{{.Id}}')
          bridge_interface="br-${network_id:0:12}"

          sudo iptables -I DOCKER-USER 1 \
            -i "$bridge_interface" ! -o "$bridge_interface" \
            -m conntrack --ctstate NEW \
            -m comment --comment "$firewall_comment" -j DROP
          if ! sudo iptables -C DOCKER-USER \
            -i "$bridge_interface" ! -o "$bridge_interface" \
            -m conntrack --ctstate NEW \
            -m comment --comment "$firewall_comment" -j DROP; then
            echo "::error::Failed to block external egress from the kind network"
            exit 1
          fi

          sudo tcpdump \
            -i "$bridge_interface" \
            -w "$capture" \
            '(ip and not dst net 10.0.0.0/8 and not dst net 172.16.0.0/12 and not dst net 192.168.0.0/16 and not dst net 127.0.0.0/8 and not dst net 169.254.0.0/16 and not multicast) or (ip6 and not dst net fc00::/7 and not dst net fe80::/10 and not dst host ::1 and not multicast)' &
          tcpdump_pid=$!

          sleep 1
          if ! sudo kill -0 "$tcpdump_pid" 2>/dev/null; then
            echo "::error::Traffic capture failed to start"
            wait "$tcpdump_pid"
            exit 1
          fi

          # External DNS isolation. The probe image is loaded from the
          # downloaded bundle (no network access): a throwaway container on
          # the kind network exercises exactly the DNS path every kind node
          # and workload container uses (Docker's built-in DNS).
          : > "$dns_probe"
          registry_tar=$(ls airgap/archives/docker.io_library_registry_*.tar 2>/dev/null | head -n 1)
          if [ -z "$registry_tar" ]; then
            echo "::error::No registry image archive found in the downloaded bundle"
            exit 1
          fi
          probe_image=$(docker load -i "$registry_tar" | sed -n 's/^Loaded image: //p' | head -n 1)
          if [ -z "$probe_image" ]; then
            echo "::error::Could not determine the loaded registry probe image ref"
            exit 1
          fi

          # Baseline (bridge block only, no DNS block yet): an external name
          # must resolve from a container on the kind network, proving the
          # egress block alone leaves a DNS hole (the dockerd built-in DNS
          # forwards upstream from the host network namespace). If it does
          # not resolve, the block assertions below would be vacuous.
          {
            echo "===== DNS baseline probe (bridge block only, no DNS block) ====="
            echo "\$ docker run --rm --network kind $probe_image getent hosts github.com"
          } >> "$dns_probe"
          if timeout 60 docker run --rm --network kind "$probe_image" \
            getent hosts github.com >> "$dns_probe" 2>&1; then
            echo "PROBE: github.com resolved under the bridge block only: external DNS is not covered by the egress block (the hole this test closes)" >> "$dns_probe"
          else
            echo "::error::DNS baseline probe failed: github.com did not resolve from a container on the kind network without the DNS block; the block assertions below would be vacuous"
            cat "$dns_probe"
            exit 1
          fi

          # Block external DNS at the host (both protocols) and verify the
          # rules landed.
          sudo iptables -I OUTPUT 1 -p udp --dport 53 ! -d 127.0.0.0/8 \
            -m comment --comment "$dns_comment" -j DROP
          sudo iptables -I OUTPUT 1 -p tcp --dport 53 ! -d 127.0.0.0/8 \
            -m comment --comment "$dns_comment" -j DROP
          if ! sudo iptables -C OUTPUT -p udp --dport 53 ! -d 127.0.0.0/8 \
                -m comment --comment "$dns_comment" -j DROP || \
              ! sudo iptables -C OUTPUT -p tcp --dport 53 ! -d 127.0.0.0/8 \
                -m comment --comment "$dns_comment" -j DROP; then
            echo "::error::Failed to block external DNS from the host"
            exit 1
          fi
          dns_block_installed=1

          # The block must be effective from inside the kind network:
          # external resolution must now fail (timeout/SERVFAIL).
          {
            echo "===== DNS block assertion (external must fail) ====="
          } >> "$dns_probe"
          if timeout 60 docker run --rm --network kind "$probe_image" \
            getent hosts github.com >> "$dns_probe" 2>&1; then
            echo "::error::External DNS still resolves with the DNS block active: the block is ineffective"
            cat "$dns_probe"
            exit 1
          fi
          echo "PROBE: github.com failed to resolve with the DNS block active (expected)" >> "$dns_probe"

          if airgap/scripts/offline-run.sh \
            airgap/zarf-package-krops-airgap-*.tar.zst; then
            deploy_result=0
          else
            deploy_result=$?
          fi

          stop_capture
          sudo tcpdump -n -r "$capture" \
            > /tmp/airgap-public-egress.txt 2>/dev/null

          # The deploy came up under both blocks. With the mgmt node and
          # krops-registry-airgap now on the kind network, re-assert the DNS
          # posture from the mgmt node itself (external still fails,
          # Docker-internal names still resolve) and assert no component
          # degraded because of a failed lookup: no crash loops, no image
          # pull failures, and no events mentioning DNS.
          assert_cluster_clean() {
            local label=$1; shift
            local bad dns_events
            bad=$("$@" get pods -A \
              -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.state.waiting.reason}{"\n"}{end}{end}' 2>/dev/null \
              | grep -E '^(CrashLoopBackOff|ErrImagePull|ImagePullBackOff)$' | sort -u)
            if [ -n "$bad" ]; then
              echo "::error::$label: pods degraded during the isolated deploy:"
              echo "$bad"
              return 1
            fi
            # DNS failure signatures only: a bare "dns" substring matches
            # coredns pod names in ordinary lifecycle events.
            dns_events=$("$@" get events -A 2>/dev/null | grep -iE '\bdns\b|no such host|server misbehaving|temporary failure in name resolution|failed to resolve')
            if [ -n "$dns_events" ]; then
              echo "::error::$label: events referencing DNS during the isolated deploy:"
              echo "$dns_events"
              return 1
            fi
            return 0
          }
          if [ "$deploy_result" -eq 0 ]; then
            {
              echo "===== Post-deploy DNS posture (mgmt node, both blocks active) ====="
            } >> "$dns_probe"
            if docker exec airgap-mgmt-control-plane timeout 60 getent hosts github.com >> "$dns_probe" 2>&1; then
              echo "::error::External DNS resolves from the mgmt node with the DNS block active after the deploy"
              cat "$dns_probe"
              exit 1
            fi
            echo "PROBE: github.com failed to resolve from the mgmt node (expected)" >> "$dns_probe"
            if ! docker exec airgap-mgmt-control-plane timeout 60 getent hosts krops-registry-airgap >> "$dns_probe" 2>&1; then
              echo "::error::Docker-internal name krops-registry-airgap does not resolve from the mgmt node"
              cat "$dns_probe"
              exit 1
            fi
            echo "PROBE: krops-registry-airgap resolved from the mgmt node (expected)" >> "$dns_probe"
            assert_cluster_clean "mgmt cluster" kubectl --context kind-airgap-mgmt || {
              cat "$dns_probe"
              exit 1
            }
            # The workload cluster, if it came up (offline-run.sh writes its
            # kubeconfig only when the workload API is reachable).
            if [ -f /tmp/airgap-wl.kubeconfig ]; then
              assert_cluster_clean "workload cluster" kubectl --kubeconfig /tmp/airgap-wl.kubeconfig || {
                cat "$dns_probe"
                exit 1
              }
            fi
          fi

          if [ -s /tmp/airgap-public-egress.txt ]; then
            echo "::error::Public network traffic was attempted during the isolated deployment"
            cat /tmp/airgap-public-egress.txt
            exit 1
          fi

          exit "$deploy_result"

      - name: Store isolated deployment evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krops-airgap-isolated-results
          path: |
            /tmp/airgap-offline-run.log
            /tmp/airgap-offline-summary.txt
            /tmp/airgap-sbom.*
            /tmp/airgap-public-egress.pcap
            /tmp/airgap-public-egress.txt
            /tmp/airgap-dns-probe.txt
            /tmp/airgap-cert-manager-debug.txt
            /tmp/airgap-workload-debug.txt
          if-no-files-found: warn
          retention-days: 1

  update-rollback:
    name: Staged update rejection and offline rollback
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install mise
        uses: jdx/mise-action@v5.2.1
        with:
          version: 2026.10.17
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download air-gap package
        uses: actions/download-artifact@v8.0.2
        with:
          name: krops-airgap-arm64-package
          path: airgap

      - name: Staged update rejection and offline rollback
        env:
          AIRGAP_VERIFY_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          zarf_bin=$(mise which zarf)
          set -- airgap/zarf-package-krops-airgap-*.tar.zst
          [ -f "$1" ] || { echo "no package found matching glob" >&2; exit 1; }
          [ "$#" -eq 1 ] || { echo "expected exactly one package, found $#" >&2; exit 1; }
          pkg=$1

          # Disk model (Part of #612): the scenarios peak at ACTIVE + .staging
          # + one zarf verify extraction (a full unpack of the package;
          # measured 1.7-2.5 GiB for the 1.6 GiB package). verify-package.sh
          # redirects that extraction via zarf --tmpdir to a sibling of the
          # SBOM dir and removes it on every exit path (zarf 0.88.0 also
          # leaks it on a failed verify, so the cleanup is load-bearing).
          # The fixtures hardlink the pristine package, which only works on
          # the same filesystem, so all test scratch lives under the
          # workspace next to the pristine:
          #   peak = 2 x pkg + extraction <= 3.6 x pkg (~5.8 GiB)
          # The preflight requires 4 x pkg free so the peak fits with margin.
          # ubuntu-26.04-arm is the only hosted ARM runner; a preflight
          # failure here means its disk is below the model above, not flaky.
          scratch="$GITHUB_WORKSPACE/.airgap-update-rollback"
          mkdir -p "$scratch"
          trap 'rm -rf "$scratch"' EXIT
          avail_kb=$(df --output=avail -k "$scratch" | tail -n 1 | tr -d '[:space:]')
          pkg_kb=$(( $(stat -c %s "$pkg") / 1024 ))
          need_kb=$(( pkg_kb * 4 ))
          if [ "$avail_kb" -lt "$need_kb" ]; then
            echo "preflight: $((avail_kb / 1024 / 1024)) GiB free under $scratch < $((need_kb / 1024 / 1024)) GiB required (4 x package size)" >&2
            exit 1
          fi

          sudo unshare --net -- env \
            PATH="$(dirname "$zarf_bin"):$PATH" \
            ZARF="$zarf_bin" \
            AIRGAP_VERIFY_WORKFLOW_REF="$AIRGAP_VERIFY_WORKFLOW_REF" \
            TMPDIR="$scratch" \
            python3 airgap/tests/test-airgap-update-rollback.py --zarf-package "$pkg" \
            2>&1 | tee /tmp/airgap-update-rollback.log

      - name: Store update rollback results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krops-airgap-update-rollback-results
          path: /tmp/airgap-update-rollback.log
          retention-days: 1

  report-status:
    name: File or close failure issue
    needs: [build, isolated-deploy, update-rollback]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the air-gapped failure issue
        uses: actions/github-script@v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const title = "air-gapped: scheduled workflow is failing";
            const labels = ["bug", "area:airgap", "area:ci", "priority:high"];
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const results = Object.values(JSON.parse(process.env.NEEDS)).map((n) => n.result);
            const failed = results.includes("failure");
            if (!failed && !results.every((r) => r === "success")) {
              return; // cancelled or skipped: neither a failure nor a recovery
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const matching = issues.filter((i) => !i.pull_request && i.title === title);

            if (failed) {
              const body = `Scheduled run failed: ${runUrl}\n\nTriggered ${context.eventName} at ${new Date().toISOString()}.`;
              if (matching.length > 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: matching[0].number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels });
              }
              return;
            }

            for (const issue of matching) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Scheduled run recovered: ${runUrl}\n\nClosing automatically.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

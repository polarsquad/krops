# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: bootstrap-rs

on:
  push:
    branches: [main]
    paths:
      - "bootstrap-rs/**"
      - "mise.toml"
      - "mise.aws.toml"
      - "mise.local-host.toml"
      - ".dockerignore"
      - ".github/workflows/bootstrap-rs.yml"
  pull_request:
    paths:
      - "bootstrap-rs/**"
      - "mise.toml"
      - "mise.aws.toml"
      - "mise.local-host.toml"
      - ".dockerignore"
      - ".github/workflows/bootstrap-rs.yml"

permissions:
  contents: read

concurrency:
  group: bootstrap-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bootstrap-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rustup respects bootstrap-rs/rust-toolchain.toml, so the pinned
      # toolchain (channel, clippy, rustfmt) installs on first cargo use.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap-rs/target
          key: bootstrap-rs-${{ runner.os }}-${{ hashFiles('bootstrap-rs/Cargo.lock', 'bootstrap-rs/rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Rot protection for the toolbox image (issue #104): the image
      # cannot silently break between releases. Loads only; the release
      # workflow (toolbox-release.yml) pushes.
      - name: Build the toolbox image (load only)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: bootstrap-rs/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: krops-toolbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the image (binary + tools on PATH)
        run: |
          # /workspace has no bootstrap.toml in CI (the repo is mounted
          # there at runtime); --help must be probed from the checkout.
          docker run --rm --entrypoint sh -v "$PWD:/workspace:ro" \
            -w /workspace krops-toolbox:ci -c '
            for t in kind kubectl helm clusterctl flux sops age aws docker xargs git curl; do
              command -v "$t" >/dev/null || { echo "::error::$t missing on PATH"; exit 1; }
            done
            krops-bootstrap --help >/dev/null'

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: markdown-lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - .markdownlint-cli2.jsonc
      - mise.toml
      - .github/workflows/markdown-lint.yml
  push:
    # renovate/**: Renovate branches must go green before automerge.
    branches: [main, "renovate/**"]
    paths:
      - "**/*.md"
      - .markdownlint-cli2.jsonc
      - mise.toml
      - .github/workflows/markdown-lint.yml

permissions:
  contents: read

concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdown lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install mise
        uses: jdx/mise-action@v5.2.1
        with:
          version: 2026.10.19
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # mise installs the pinned node and markdownlint-cli2 (npm backend)
      # from mise.toml, then the task lints every tracked Markdown file with
      # the shared rules in .markdownlint-cli2.jsonc.
      - name: Lint Markdown
        run: mise run markdown-lint

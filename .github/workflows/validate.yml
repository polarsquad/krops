name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  airgap-image-pins:
    name: Air-gap image digest pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify committed air-gap image digests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 airgap/tests/test-airgap-image-digests.py --changed-from "$BASE_SHA"

  kustomize-build:
    name: Build kustomize overlays
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install kustomize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sSf --retry 3 --retry-delay 2 -H "Authorization: token ${GITHUB_TOKEN}" "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Build every overlay
        run: |
          fail=0
          for dir in $(find mgmt workload -name kustomization.yaml -exec dirname {} \; | sort -u); do
            echo "==> kustomize build $dir"
            if ! kustomize build "$dir" >/dev/null; then
              echo "    FAILED: $dir" >&2
              fail=1
            fi
          done
          exit $fail

  renovate-digest-pinning:
    name: Renovate airgap digest pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0

      - name: Install Renovate
        run: npm install --global renovate@44.69.8

      - name: Verify airgap digest pinning
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: python3 airgap/tests/test-renovate-digest-pinning.py

      - name: Verify Renovate pin coverage for catalog-replaced surfaces
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: python3 tests/test-renovate-coverage.py

      - name: Verify Renovate updates Zarf release assets and checksums together
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: python3 tests/test-renovate-release-assets.py

      - name: bootstrap.toml cross-check
        run: python3 tests/test-bootstrap-config.py

      # uv run resolves pyyaml from pyproject.toml/uv.lock, the same environment
      # mise run validate uses for this cross-check.
      - name: Azure identity chain cross-check
        run: |
          uv sync --locked
          uv run python tests/test-azure-identity-chain.py

  yaml-lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: mgmt workload
          config_data: |
            extends: default
            ignore: |
              *.sops.yaml
            rules:
              line-length: disable
              document-start: disable
              comments:
                min-spaces-from-content: 1
              indentation:
                spaces: consistent
                indent-sequences: consistent

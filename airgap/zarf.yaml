# Zarf package: air-gapped krops prototype (local-host / CAPD profile).
#
# Ownership split:
#   Zarf deploys the substrate  : cert-manager, flux-operator, FluxInstance,
#                                 CAPI core, kubeadm bootstrap/control-plane,
#                                 CAPD, CAAPH, and the krops config artifact.
#   Flux reconciles the workload: the trimmed mgmt/local-host tree carried as
#                                 the krops-airgap OCI artifact (clusters/,
#                                 addons/cni/, addons/flux-apps/).
#
# The kind node images and the workload-node pod images are NOT in this
# package; they travel next to it as docker-save tarballs in archives/ and are
# loaded into the host Docker daemon by scripts/stage-and-create-cluster.sh
# before any cluster exists.
kind: ZarfPackageConfig
metadata:
  name: krops-airgap
  version: 0.1.0
  description: Air-gapped krops prototype (local-host CAPD profile)
  architecture: arm64
constants:
  # In-cluster DNS name of the Zarf internal registry. In-cluster fetchers
  # (source-controller pulling the config artifact) must use this; the
  # nodeport address 127.0.0.1:31999 only resolves from a node's loopback.
  # The Zarf-generated private-registry pull secret covers this name.
  - name: REGISTRY_INTERNAL
    value: zarf-docker-registry.zarf.svc.cluster.local:5000
    description: In-cluster address of the Zarf internal registry
components:
  # cert-manager first: the CAPI provider components create Issuer/Certificate
  # resources that need cert-manager's CRDs and running controllers.
  - name: cert-manager
    required: true
    charts:
      - name: cert-manager
        namespace: cert-manager
        url: https://charts.jetstack.io
        version: v1.21.1
        valuesFiles:
          - values/cert-manager.yaml
    images:
      - quay.io/jetstack/cert-manager-controller:v1.21.1
      - quay.io/jetstack/cert-manager-cainjector:v1.21.1
      - quay.io/jetstack/cert-manager-webhook:v1.21.1
      - quay.io/jetstack/cert-manager-startupapicheck:v1.21.1
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: cert-manager
        namespace: cert-manager
      - apiVersion: apps/v1
        kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
      - apiVersion: apps/v1
        kind: Deployment
        name: cert-manager-cainjector
        namespace: cert-manager

  # flux-operator chart: installs the operator and the FluxInstance CRD.
  - name: flux-operator
    required: true
    charts:
      - name: flux-operator
        namespace: flux-system
        url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
        version: 0.58.0
    images:
      - ghcr.io/controlplaneio-fluxcd/flux-operator:v0.58.0
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: flux-operator
        namespace: flux-system

  # krops GitOps config artifact. Built connected-side by
  # scripts/build-config-artifact.sh (trimmed airgap tree, pushed to the local
  # registry), then carried across the gap inside this package and pushed into
  # the Zarf internal registry at deploy time by Zarf's image pipeline.
  - name: krops-config
    required: true
    description: krops mgmt/local-host (airgap-trimmed) as an OCI artifact
    images:
      - localhost:5001/krops-airgap:latest

  # FluxInstance: points the management Flux at the config artifact in the
  # Zarf internal registry. distribution.artifact is omitted so the operator
  # uses its embedded distribution manifests (offline-safe).
  #
  # Deployed via files: + an apply action, NOT a manifests: entry. In v0.83
  # Zarf wraps manifests in a generated Helm chart whose install fails on CRs
  # it cannot adopt ("exists and cannot be imported into the current
  # release"), and the flux-instance Helm chart is unusable offline because it
  # renders spec.distribution.artifact unconditionally (the operator then
  # tries HTTPS against the plain-HTTP internal registry and fails).
  - name: flux-instance
    required: true
    files:
      - source: manifests/flux-instance.yaml
        target: /tmp/krops-airgap/flux-instance.yaml
    actions:
      onDeploy:
        after:
          - description: Apply the FluxInstance (kubectl, ambient context)
            cmd: kubectl apply -f /tmp/krops-airgap/flux-instance.yaml
            maxTotalSeconds: 120
          - description: Wait for Flux to be Ready (controllers + sync)
            cmd: kubectl -n flux-system wait --for=condition=Ready fluxinstance/flux --timeout=10m
            maxTotalSeconds: 640
    images:
      - ghcr.io/fluxcd/source-controller:v1.9.4
      - ghcr.io/fluxcd/kustomize-controller:v1.9.4
      - ghcr.io/fluxcd/helm-controller:v1.6.3
      - ghcr.io/fluxcd/notification-controller:v1.9.3

  # CAPI core: 13 CRDs (Cluster, Machine, MachineDeployment, ClusterClass,
  # ClusterResourceSet, ...) + the capi-controller-manager. Captured from the
  # v1.14.0 release asset (the capi-operator normally fetches it online; in
  # the gap the operator is absent, so Zarf applies the components directly).
  - name: capi-core
    required: true
    manifests:
      - name: capi-core
        files:
          - manifests/core-cluster-api.components.yaml
    images:
      - registry.k8s.io/cluster-api/cluster-api-controller:v1.14.0
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: capi-controller-manager
        namespace: capi-system

  # CAPI providers: bootstrap, control-plane, and CAPD infrastructure.
  # Captured from the live cluster's capi-operator ConfigMaps.
  - name: capi-providers
    required: true
    manifests:
      - name: kubeadm-bootstrap
        files:
          - manifests/bootstrap-kubeadm.components.yaml
      - name: kubeadm-control-plane
        files:
          - manifests/control-plane-kubeadm.components.yaml
      - name: capd
        files:
          - manifests/infrastructure-docker.components.yaml
    images:
      - registry.k8s.io/cluster-api/kubeadm-bootstrap-controller:v1.14.0
      - registry.k8s.io/cluster-api/kubeadm-control-plane-controller:v1.14.0
      - gcr.io/k8s-staging-cluster-api/capd-manager:v1.14.0
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: capi-kubeadm-bootstrap-controller-manager
        namespace: capi-kubeadm-bootstrap-system
      - apiVersion: apps/v1
        kind: Deployment
        name: capi-kubeadm-control-plane-controller-manager
        namespace: capi-kubeadm-control-plane-system
      - apiVersion: apps/v1
        kind: Deployment
        name: capd-controller-manager
        namespace: capd-system

  # CAAPH (cluster-api-helm): ClusterResourceSet-driven per-cluster Flux.
  # Captured from the live cluster's capi-operator ConfigMap.
  - name: caaph
    required: true
    manifests:
      - name: caaph
        files:
          - manifests/addon-helm.components.yaml
    images:
      - registry.k8s.io/cluster-api-helm/cluster-api-helm-controller:v0.6.4
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: caaph-controller-manager
        namespace: caaph-system

# Zarf package: air-gapped krops prototype (local-host / CAPD profile).
#
# Ownership split:
#   Zarf deploys the substrate  : cert-manager, flux-operator, FluxInstance,
#                                 CAPI core, kubeadm bootstrap/control-plane,
#                                 CAPD, CAAPH, and the krops config artifact.
#   Flux reconciles the workload: the trimmed mgmt/local-host tree carried as
#                                 the krops-airgap OCI artifact (clusters/,
#                                 addons/cni/, addons/flux-apps/).
#
# The kind node images and the workload-node pod images are NOT in this
# package; they travel next to it as docker-save tarballs in archives/ and are
# loaded into the host Docker daemon by scripts/stage-and-create-cluster.sh
# before any cluster exists.
kind: ZarfPackageConfig
metadata:
  name: krops-airgap
  version: 0.1.0
  description: Air-gapped krops prototype (local-host CAPD profile)
  architecture: arm64
constants:
  # In-cluster DNS name of the Zarf internal registry. In-cluster fetchers
  # (source-controller pulling the config artifact) must use this; the
  # nodeport address 127.0.0.1:31999 only resolves from a node's loopback.
  # The Zarf-generated private-registry pull secret covers this name.
  - name: REGISTRY_INTERNAL
    value: zarf-docker-registry.zarf.svc.cluster.local:5000
    description: In-cluster address of the Zarf internal registry
components:
  # cert-manager first: the CAPI provider components create Issuer/Certificate
  # resources that need cert-manager's CRDs and running controllers.
  - name: cert-manager
    required: true
    charts:
      - name: cert-manager
        namespace: cert-manager
        url: https://charts.jetstack.io
        # renovate: datasource=helm registryUrl=https://charts.jetstack.io depName=cert-manager
        version: v1.21.2
        valuesFiles:
          - values/cert-manager.yaml
    images:
      - quay.io/jetstack/cert-manager-controller:v1.21.2@sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
      - quay.io/jetstack/cert-manager-cainjector:v1.21.2@sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
      - quay.io/jetstack/cert-manager-webhook:v1.21.2@sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
      - quay.io/jetstack/cert-manager-startupapicheck:v1.21.2@sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: cert-manager
        namespace: cert-manager
      - apiVersion: apps/v1
        kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
      - apiVersion: apps/v1
        kind: Deployment
        name: cert-manager-cainjector
        namespace: cert-manager

  # flux-operator chart: installs the operator and the FluxInstance CRD.
  - name: flux-operator
    required: true
    charts:
      - name: flux-operator
        namespace: flux-system
        url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
        version: 0.58.0
        valuesFiles:
          - values/flux-operator.yaml
    images:
      - ghcr.io/controlplaneio-fluxcd/flux-operator:v0.58.0@sha256:1c919ce1e28716f817ded65c06df0b7a8269542387d5a2ce50212450473c6209
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: flux-operator
        namespace: flux-system

  # krops GitOps config artifact. Built connected-side by
  # scripts/build-config-artifact.sh (trimmed airgap tree, pushed to the local
  # registry), then carried across the gap inside this package and pushed into
  # the Zarf internal registry at deploy time by Zarf's image pipeline.
  - name: krops-config
    required: true
    description: krops mgmt/local-host (airgap-trimmed) as an OCI artifact
    images:
      - localhost:5001/krops-airgap:latest

  # FluxInstance: points the management Flux at the config artifact in the
  # Zarf internal registry. distribution.artifact is omitted so the operator
  # uses its embedded distribution manifests (offline-safe).
  #
  # Deployed via files: + an apply action, NOT a manifests: entry. In v0.83
  # Zarf wraps manifests in a generated Helm chart whose install fails on CRs
  # it cannot adopt ("exists and cannot be imported into the current
  # release"), and the flux-instance Helm chart is unusable offline because it
  # renders spec.distribution.artifact unconditionally (the operator then
  # tries HTTPS against the plain-HTTP internal registry and fails).
  - name: flux-instance
    required: true
    files:
      - source: manifests/flux-instance.yaml
        target: /tmp/krops-airgap/flux-instance.yaml
    actions:
      onDeploy:
        after:
          - description: Apply the FluxInstance (kubectl, ambient context)
            cmd: kubectl apply -f /tmp/krops-airgap/flux-instance.yaml
            maxTotalSeconds: 120
          - description: Wait for Flux to be Ready (controllers + sync)
            cmd: kubectl -n flux-system wait --for=condition=Ready fluxinstance/flux --timeout=1m
            maxTotalSeconds: 70
    images:
      - ghcr.io/fluxcd/source-controller:v1.9.4@sha256:8a8ed0a57b8b86f561d5a4309a69f65e62f0cebe4de8801593c5ff35a3bc3c23
      - ghcr.io/fluxcd/kustomize-controller:v1.9.4@sha256:2b8bec54ffb6caf421bd2a6c005d27f567d5dd4db7feb55794fb51fcabd69b8f
      - ghcr.io/fluxcd/helm-controller:v1.6.3@sha256:16ada99456385100698a5d7adf90aba8a2089d987ab541c9566b6d7b0e897038
      - ghcr.io/fluxcd/notification-controller:v1.9.3@sha256:071c351a0fb163eeb6a2bb82f1e894f51b6b0734216d2e97d3d99c9ab9d710b9

  # CAPI core: 13 CRDs (Cluster, Machine, MachineDeployment, ClusterClass,
  # ClusterResourceSet, ...) + the capi-controller-manager, rendered with
  # clusterctl at deploy time. See docs/airgap.md's "Empirical findings" #1
  # for why, and for what this component stages for capi-providers/caaph.
  - name: capi-core
    required: true
    files:
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.1/clusterctl-darwin-arm64
        shasum: bce7a27ee9dd3f3cbdd3b463203a706ec31ea6ee98926045fbd9dfbe9c020f4b
        target: /tmp/krops-airgap/bin/clusterctl-darwin-arm64
        executable: true
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.1/clusterctl-linux-arm64
        shasum: 16ec2d3ab39338e94dfa9ddb070c4f37073683db517fa6052ffc38d6702d7d8b
        target: /tmp/krops-airgap/bin/clusterctl-linux-arm64
        executable: true
      - source: files/clusterctl-providers.yaml
        target: /tmp/krops-airgap/clusterctl-providers.yaml
      - source: images.txt
        target: /tmp/krops-airgap/images.txt
      - source: scripts/resolve-clusterctl.sh
        target: /tmp/krops-airgap/scripts/resolve-clusterctl.sh
        executable: true
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-core
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/core-components.yaml
        shasum: b2fff42cb5e35440ed963a463c5ab128004481b5a4336ea0005812be2ff7e2a8
        target: /tmp/krops-airgap/capi/cluster-api/v1.14.2/core-components.yaml
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-core
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/metadata.yaml
        shasum: c470906f551ac3e3e9aedc9a3e733b5a5994428693df43e95f65ea67c035f9fe
        target: /tmp/krops-airgap/capi/cluster-api/v1.14.2/metadata.yaml
    actions:
      onDeploy:
        after:
          - description: Render and apply the core CAPI provider
            cmd: |
              . /tmp/krops-airgap/scripts/resolve-clusterctl.sh
              copy_registry_secret capi-system || exit 1
              rendered=/tmp/krops-airgap/capi/core.rendered.yaml
              # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-core
              "$clusterctl" generate provider --core cluster-api:v1.14.2 \
                --config /tmp/krops-airgap/clusterctl-providers.yaml \
                --write-to "$rendered" &&
              patch_feature_gates "$rendered" &&
              pin_image_digests "$rendered" &&
              kubectl apply -f "$rendered"
            maxTotalSeconds: 120
    images:
      - registry.k8s.io/cluster-api/cluster-api-controller:v1.14.2@sha256:031f0d7cbef66b324ae247852adc9ae6f788cd499bd57fe38c581804147fb035
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: capi-controller-manager
        namespace: capi-system

  # CAPI providers: bootstrap, control-plane, and CAPD infrastructure,
  # rendered with clusterctl at deploy time. See docs/airgap.md's "Empirical
  # findings" #1; reuses what capi-core (above) staged.
  - name: capi-providers
    required: true
    files:
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-bootstrap-kubeadm
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/bootstrap-components.yaml
        shasum: 2a2d24f83244a6dae60e35d9e72e93c6ac3c209eedc467184737bb8eecfd63bb
        target: /tmp/krops-airgap/capi/bootstrap-kubeadm/v1.14.2/bootstrap-components.yaml
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-bootstrap-kubeadm
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/metadata.yaml
        shasum: c470906f551ac3e3e9aedc9a3e733b5a5994428693df43e95f65ea67c035f9fe
        target: /tmp/krops-airgap/capi/bootstrap-kubeadm/v1.14.2/metadata.yaml
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-control-plane-kubeadm
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/control-plane-components.yaml
        shasum: 7aa827b43eee898d8597bb39b7db5cf755c872c7a4da68b05cc3a9f35c459c93
        target: /tmp/krops-airgap/capi/control-plane-kubeadm/v1.14.2/control-plane-components.yaml
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-control-plane-kubeadm
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/metadata.yaml
        shasum: c470906f551ac3e3e9aedc9a3e733b5a5994428693df43e95f65ea67c035f9fe
        target: /tmp/krops-airgap/capi/control-plane-kubeadm/v1.14.2/metadata.yaml
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-infrastructure-docker
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/infrastructure-components-development.yaml
        shasum: f6aef43bf70b76a38b1628cd4349d291159fbfd8082dbe9c2ec13d04487b5867
        target: /tmp/krops-airgap/capi/infrastructure-docker/v1.14.2/infrastructure-components-development.yaml
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-infrastructure-docker
      - source: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/metadata.yaml
        shasum: c470906f551ac3e3e9aedc9a3e733b5a5994428693df43e95f65ea67c035f9fe
        target: /tmp/krops-airgap/capi/infrastructure-docker/v1.14.2/metadata.yaml
    actions:
      onDeploy:
        after:
          - description: Render and apply the kubeadm bootstrap, kubeadm control-plane, and CAPD providers
            cmd: |
              . /tmp/krops-airgap/scripts/resolve-clusterctl.sh
              config=/tmp/krops-airgap/clusterctl-providers.yaml
              copy_registry_secret capi-kubeadm-bootstrap-system capi-kubeadm-control-plane-system capd-system &&
              # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-bootstrap-kubeadm
              "$clusterctl" generate provider --bootstrap kubeadm:v1.14.2 \
                --config "$config" --write-to /tmp/krops-airgap/capi/bootstrap.rendered.yaml &&
              patch_feature_gates /tmp/krops-airgap/capi/bootstrap.rendered.yaml &&
              pin_image_digests /tmp/krops-airgap/capi/bootstrap.rendered.yaml &&
              kubectl apply -f /tmp/krops-airgap/capi/bootstrap.rendered.yaml &&
              # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-control-plane-kubeadm
              "$clusterctl" generate provider --control-plane kubeadm:v1.14.2 \
                --config "$config" --write-to /tmp/krops-airgap/capi/control-plane.rendered.yaml &&
              patch_feature_gates /tmp/krops-airgap/capi/control-plane.rendered.yaml &&
              pin_image_digests /tmp/krops-airgap/capi/control-plane.rendered.yaml &&
              kubectl apply -f /tmp/krops-airgap/capi/control-plane.rendered.yaml &&
              # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-infrastructure-docker
              "$clusterctl" generate provider --infrastructure docker:v1.14.2 \
                --config "$config" --write-to /tmp/krops-airgap/capi/infrastructure.rendered.yaml &&
              patch_feature_gates /tmp/krops-airgap/capi/infrastructure.rendered.yaml &&
              pin_image_digests /tmp/krops-airgap/capi/infrastructure.rendered.yaml &&
              kubectl apply -f /tmp/krops-airgap/capi/infrastructure.rendered.yaml
            maxTotalSeconds: 180
    images:
      - registry.k8s.io/cluster-api/kubeadm-bootstrap-controller:v1.14.2@sha256:31adb8a779173e6d106757b509b142549caddcc248fccc65b774b11d3a6f4c02
      - registry.k8s.io/cluster-api/kubeadm-control-plane-controller:v1.14.2@sha256:fb991a63cbe3e534f3bbec993009abf45c6d076e9b36366d073155aec3adade3
      - gcr.io/k8s-staging-cluster-api/capd-manager:v1.14.2@sha256:ba1cb33f80ef97e222922023797672efb1c1a4ebe3920ee28e042cd48103bc98
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: capi-kubeadm-bootstrap-controller-manager
        namespace: capi-kubeadm-bootstrap-system
      - apiVersion: apps/v1
        kind: Deployment
        name: capi-kubeadm-control-plane-controller-manager
        namespace: capi-kubeadm-control-plane-system
      - apiVersion: apps/v1
        kind: Deployment
        name: capd-controller-manager
        namespace: capd-system

  # CAAPH provider, rendered with clusterctl. See docs/airgap.md's "Empirical
  # findings" #1; reuses what capi-core (above) staged.
  - name: caaph
    required: true
    actions:
      onDeploy:
        after:
          - description: Render and apply the staged CAAPH provider
            cmd: |
              . /tmp/krops-airgap/scripts/resolve-clusterctl.sh
              copy_registry_secret caaph-system &&
              # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-addon-provider-helm
              "$clusterctl" generate provider --addon helm:v0.6.4 \
                --config /tmp/krops-airgap/clusterctl-providers.yaml \
                --write-to /tmp/krops-airgap/caaph/addon-components.rendered.yaml &&
              pin_image_digests /tmp/krops-airgap/caaph/addon-components.rendered.yaml &&
              kubectl apply -f /tmp/krops-airgap/caaph/addon-components.rendered.yaml
            maxTotalSeconds: 120
    files:
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-addon-provider-helm
      - source: https://github.com/kubernetes-sigs/cluster-api-addon-provider-helm/releases/download/v0.6.4/addon-components.yaml
        shasum: a70f4eb77eac626231daca1e2a046b4b069bb84320efa327cc8c56a9c4ca03e6
        target: /tmp/krops-airgap/caaph/addon-helm/v0.6.4/components.yaml
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cluster-api-addon-provider-helm
      - source: https://github.com/kubernetes-sigs/cluster-api-addon-provider-helm/releases/download/v0.6.4/metadata.yaml
        shasum: d50a44ee0db2f0368699d15ff011b9b5a61d9969483de1c4f6e4e6046390530f
        target: /tmp/krops-airgap/caaph/addon-helm/v0.6.4/metadata.yaml
    images:
      - registry.k8s.io/cluster-api-helm/cluster-api-helm-controller:v0.6.4@sha256:97d2a86f8e35d23bb4656b26f4564b35f109e47a0dc4860b71089e52eb6e6a24
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: caaph-controller-manager
        namespace: caaph-system

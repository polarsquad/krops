[package]
name = "krops-bootstrap"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
description = "One-time imperative bootstrap for the krops management cluster (Rust port of bootstrap.sh)"
license = "Apache-2.0"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
indexmap = { version = "=2.14.1", features = ["serde"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
toml = { version = "=1.1.5+spec-1.1.0", features = ["preserve_order"] }
tempfile = "=3.27.0"

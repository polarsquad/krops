# Repository-owned configuration for krops-bootstrap (issue #98).
#
# Everything krops-specific the binary needs is declared here; the binary
# itself is a generic bootstrap engine. Environment variables (REGISTRY_PORT,
# GIT_REPO_URL, BOOTSTRAP_KUBECONTEXT, ...) keep their precedence over these
# values at runtime. Locate this file with BOOTSTRAP_CONFIG when not running
# from the repository root.
#
# Environment order matters: error messages list environments in file order
# to preserve bootstrap.sh's exact wording ('local-host' before 'aws').
#
# Profile resolution: the [environments.*] section name is authoritative;
# KROPS_PROFILE matches it exactly. Each environment's `kind` restates
# the section name, and the cross-check fails if the two disagree.

[bootstrap]
default-environment = "aws"
git-branch = "main"
kind-cluster = "mgmt"
kind-context = "kind-mgmt"
registry-name = "krops-registry"
flux-namespace = "flux-system"
github-pat-secret = "flux-github-pat"
sops-age-secret = "sops-age"
mgmt-namespace = "default"
mgmt-context = "krops-mgmt"

[charts]
# Chart versions installed imperatively before Flux exists. Keep in sync
# with the HelmReleases/HelmChartProxies in mgmt/<env>/ so Flux adopts the
# installs without drift; `mise run validate` cross-checks them and Renovate
# updates both sides together.
# flux-operator and flux-instance version together upstream, so this one
# pin serves both chart installs (FLUX_CHART_VERSION in main.rs).
# renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
flux-operator = "0.58.0"
# renovate: datasource=helm registryUrl=https://charts.jetstack.io depName=cert-manager
cert-manager = "1.21.1"
# renovate: datasource=helm registryUrl=https://kubernetes-sigs.github.io/cluster-api-operator depName=cluster-api-operator
capi-operator = "0.28.0"

[teardown]
# Constants for `krops-bootstrap teardown` (issue #100), mirroring the literal
# lists in teardown.sh; tests/test-bootstrap-config.py cross-checks them
# against the Git manifests that define the same names.
# CloudFormation stack created by `clusterawsadm bootstrap iam`.
cfn-stack-name = "cluster-api-provider-aws-sigs-k8s-io"
# Region-independent IAM roles: the ACK controller pod-identity roles
# (mgmt/aws/infrastructure/ack-pod-identity/) and the per-cluster reader
# roles created by the workload ACK IAM controllers.
global-iam-roles = [
  "krops-ack-s3-controller",
  "krops-ack-rds-controller",
  "krops-ack-iam-controller",
  "krops-eu-north-1-workload-reader",
  "krops-eu-west-1-workload-reader",
]
# The console reader user created by the management cluster's ACK IAM
# controller (mgmt/aws/infrastructure/aws-global-iam/reader-user.yaml).
global-iam-users = ["krops-reader"]
# S3 bucket pattern (workload/base/s3-buckets/bucket.yaml).
s3-bucket-pattern = "krops-{account_id}-{cluster_name}-data"

[environments.local-host]
kind = "local-host"
# Flux syncs the OCI artifact published from the checkout by oci-push.
sync = "oci"
sync-path = "mgmt/local-host"
mgmt-cluster = "local-management"
mgmt-ready-timeout = "15m"
infra-provider-namespace = "capd-system"
infra-provider-name = "docker"
provider-manifests = [
  "mgmt/local-host/capi-providers/capi-system/namespace.yaml",
  "mgmt/local-host/capi-providers/capi-system/providers.yaml",
  "mgmt/local-host/capi-providers/capd-system/namespace.yaml",
  "mgmt/local-host/capi-providers/capd-system/provider.yaml",
  "mgmt/local-host/capi-providers/caaph-system/namespace.yaml",
  "mgmt/local-host/capi-providers/caaph-system/provider.yaml",
]

[environments.local-host.teardown]
# CAPD workload clusters deleted before the management cluster; their
# Kustomization is suspended first so Flux does not recreate them.
capi-workloads = ["local-workload"]
# The self-managed management cluster is removed at the container level
# (a cluster cannot delete its own Cluster object cleanly): its node/lb
# containers share this prefix.
mgmt-container-prefix = "local-management"

[environments.aws]
kind = "aws"
# Flux syncs the GitHub repository (GitRepository + flux-github-pat).
sync = "github"
sync-path = "mgmt/aws"
mgmt-cluster = "eu-north-1-management"
mgmt-ready-timeout = "40m"
infra-provider-namespace = "capa-system"
infra-provider-name = "aws"
provider-manifests = [
  "mgmt/aws/capi-providers/capi-system/namespace.yaml",
  "mgmt/aws/capi-providers/capi-system/providers.yaml",
  "mgmt/aws/capi-providers/capa-system/namespace.yaml",
  "mgmt/aws/capi-providers/capa-system/providers.yaml",
  "mgmt/aws/capi-providers/caaph-system/namespace.yaml",
  "mgmt/aws/capi-providers/caaph-system/addon-provider.yaml",
]

# Objects clusterctl move should carry over but that are re-applied from
# the checkout if they are missing in the target after the move.
[[environments.aws.move-fallbacks]]
resource = "awsclustercontrolleridentities.infrastructure.cluster.x-k8s.io"
name = "default"
manifest = "mgmt/aws/infrastructure/aws-identity/identity.yaml"

[environments.aws.teardown]
# The self-managed management cluster (post-pivot) is removed through the
# AWS orphan sweep, never via its own Cluster object: deleting it from
# itself kills the CAPA controller mid-delete. Its names join the sweep.
mgmt-eks-cluster-name = "default_eu-north-1-management-control-plane"
mgmt-iam-role-prefix = "eu-north-1-management"
# Workload clusters the orphan sweep visits (order: file order = sweep
# order). Names mirror the Kustomization namePrefixes and the cluster-vars
# substitutions in mgmt/aws/addons/flux-apps/flux-instance.yaml.
[[environments.aws.teardown.aws-workloads]]
region = "eu-north-1"
cluster-name = "eu-north-1-workload"
eks-cluster-name = "default_eu-north-1-workload-control-plane"
rds-instance = "krops-eu-north-1-workload-db"

[[environments.aws.teardown.aws-workloads]]
region = "eu-west-1"
cluster-name = "eu-west-1-workload"
eks-cluster-name = "default_eu-west-1-workload-control-plane"
rds-instance = "krops-eu-west-1-workload-db"

[environments.local-talos]
kind = "local-talos"
# Flux syncs the GitHub repository, like aws: a physical machine cannot
# reach the laptop's OCI registry (issue #105 decision). Requires a GitHub
# PAT (flux-github-pat), unlike local-host.
sync = "github"
sync-path = "mgmt/local-talos"
mgmt-cluster = "local-talos-management"
# PXE install + first Talos boot takes longer than kind/EKS provisioning.
mgmt-ready-timeout = "30m"
# The Tinkerbell infrastructure provider (well-known clusterctl name
# "tinkerbell-tinkerbell", see capi-providers/capt-system/provider.yaml).
infra-provider-namespace = "capt-system"
infra-provider-name = "tinkerbell-tinkerbell"
provider-manifests = [
  "mgmt/local-talos/capi-providers/capi-system/namespace.yaml",
  "mgmt/local-talos/capi-providers/capi-system/providers.yaml",
  "mgmt/local-talos/capi-providers/cabpt-system/namespace.yaml",
  "mgmt/local-talos/capi-providers/cabpt-system/provider.yaml",
  "mgmt/local-talos/capi-providers/cacppt-system/namespace.yaml",
  "mgmt/local-talos/capi-providers/cacppt-system/provider.yaml",
  "mgmt/local-talos/capi-providers/capt-system/namespace.yaml",
  "mgmt/local-talos/capi-providers/capt-system/provider.yaml",
]

[environments.local-talos.teardown]
# local-talos owns no workload clusters (scope fence: management-only).
capi-workloads = []
# Bare-metal semantics (issue #105 scope item 8): teardown deletes the
# CAPI objects so CAPT releases the Tinkerbell Hardware back to the pool,
# but the machine itself is never wiped or reclaimed: it is left running
# Talos for the operator to re-use or PXE-boot fresh. No container-prefix
# sweep (that is the local-host CAPD path) and no AWS orphan sweep.
hardware-release = true

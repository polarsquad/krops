  <!-- ===== flow panel ===== -->
  <rect x="1090" y="150" width="446" height="904" rx="14" fill="#131E18" stroke="#284637" stroke-width="1.5"/>

  <!-- step 1 -->
  <circle cx="1140" cy="204" r="15" fill="#5CE0B4"/>
  <text x="1140" y="210" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">1</text>
  <text x="1168" y="200" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Management cluster Flux syncs</text>
  <text x="1168" y="226" font-family="DejaVu Sans Mono" font-size="16" fill="#5CE0B4">mgmt/azure/<tspan font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">, provisions AKS</tspan></text>
  <text x="1168" y="252" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">clusters via CAPZ + bundled ASO,</text>
  <text x="1168" y="278" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">and installs Flux via <tspan font-family="DejaVu Sans Mono" font-size="16" fill="#5CE0B4">flux-apps</tspan>.</text>
  <line x1="1122" y1="310" x2="1504" y2="310" stroke="#1F362A" stroke-width="1.2"/>

  <!-- step 2 -->
  <circle cx="1140" cy="354" r="15" fill="#B0F6C0"/>
  <text x="1140" y="360" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">2</text>
  <text x="1168" y="350" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Bundled ASO reconciles identity:</text>
  <text x="1168" y="376" font-family="DejaVu Sans Mono" font-size="15.5" fill="#B0F6C0">krops-capz + krops-aso UAMIs, data RG,</text>
  <text x="1168" y="402" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Contributor roles, and FICs for the</text>
  <text x="1168" y="428" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">CAPZ/ASO SAs and the workload SA.</text>
  <line x1="1122" y1="462" x2="1504" y2="462" stroke="#1F362A" stroke-width="1.2"/>

  <!-- step 3 -->
  <circle cx="1140" cy="510" r="15" fill="#68C5EB"/>
  <text x="1140" y="516" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">3</text>
  <text x="1168" y="506" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Workload cluster runs local Flux:</text>
  <text x="1168" y="540" font-family="DejaVu Sans Mono" font-size="17" fill="#D4E2DA">1. <tspan fill="#FFFFFF">cert-manager</tspan></text>
  <text x="1168" y="568" font-family="DejaVu Sans Mono" font-size="17" fill="#D4E2DA">2. <tspan fill="#FFFFFF">aso</tspan> <tspan font-family="DejaVu Sans" font-size="15" fill="#859D91">(Workload Identity)</tspan></text>
  <text x="1168" y="596" font-family="DejaVu Sans Mono" font-size="17" fill="#D4E2DA">3. <tspan fill="#FFFFFF">networking &#183; storage</tspan></text>
  <text x="1168" y="624" font-family="DejaVu Sans Mono" font-size="17" fill="#D4E2DA">4. <tspan fill="#FFFFFF">postgres</tspan> <tspan font-family="DejaVu Sans" font-size="14.5" fill="#859D91">(dependsOn: networking)</tspan></text>
  <line x1="1122" y1="658" x2="1504" y2="658" stroke="#1F362A" stroke-width="1.2"/>

  <!-- step 4 -->
  <circle cx="1140" cy="704" r="15" fill="#E8A868"/>
  <text x="1140" y="710" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">4</text>
  <text x="1168" y="700" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Workload ASO creates cloud infra:</text>
  <text x="1168" y="726" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">VNet + delegated subnet + DNS,</text>
  <text x="1168" y="752" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Storage Account + blob container,</text>
  <text x="1168" y="778" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">PostgreSQL (Entra-only auth).</text>
  <line x1="1122" y1="808" x2="1504" y2="808" stroke="#1F362A" stroke-width="1.2"/>

  <!-- golden rule -->
  <text x="1122" y="848" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#E5B85C">Golden rule</text>
  <text x="1122" y="880" font-family="DejaVu Sans" font-size="18" fill="#D4E2DA">Edit YAML in Git; never mutate</text>
  <text x="1122" y="908" font-family="DejaVu Sans" font-size="18" fill="#D4E2DA">the clusters. Flux tracks <tspan font-family="DejaVu Sans Mono" font-size="17" fill="#FFFFFF">main</tspan>:</text>
  <text x="1122" y="936" font-family="DejaVu Sans" font-size="18" fill="#D4E2DA">nothing reconciles until merged.</text>
  <line x1="1122" y1="966" x2="1504" y2="966" stroke="#1F362A" stroke-width="1.2"/>

  <!-- color key -->
  <circle cx="1132" cy="1006" r="6" fill="#5CE0B4"/>
  <text x="1146" y="1012" font-family="DejaVu Sans Mono" font-size="14" fill="#D4E2DA">mgmt</text>
  <circle cx="1210" cy="1006" r="6" fill="#B0F6C0"/>
  <text x="1224" y="1012" font-family="DejaVu Sans Mono" font-size="14" fill="#D4E2DA">git</text>
  <circle cx="1282" cy="1006" r="6" fill="#68C5EB"/>

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eu-north-1
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/aws/clusters/eu-north-1
  postBuild:
    # Always: with the default strategy, an absent krops-run ConfigMap yields no
    # variables and Flux skips substitution, leaving the literal
    # ${KROPS_*:=default} text in the tag values (IAM rejects '$', '{', '}').
    substituteStrategy: Always
    substituteFrom:
      - kind: ConfigMap
        name: krops-run
        optional: true
  dependsOn:
    - name: capa-system
---

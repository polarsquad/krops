---
# ══════════════════════════════════════════════════════════════════════════════
# Secure-by-default S3 buckets, one per workload cluster, reconciled by the
# ACK S3 controller running on THIS (management) cluster.
#
# S3 bucket names are globally unique, so the account ID and cluster name are
# part of each name. There is no cluster-vars ConfigMap on the management
# cluster, so the values are literal (the account ID is already a literal in
# mgmt/aws/addons/flux-apps/flux-instance.yaml).
#
# The controller's default region is eu-north-1; the eu-west-1 bucket overrides
# it with the services.k8s.aws/region annotation.
#
# services.k8s.aws/adoption-policy: adopt-or-create — these CRs are applied
# twice per bootstrap (the kind bootstrap cluster creates the real buckets
# before the pivot; the management cluster's Flux re-applies the same CRs
# after it), so the post-pivot controller must adopt the existing bucket
# instead of going Terminal with "Resource already exists".
#
# Security posture:
#   - All public access blocked
#   - Server-side encryption enforced (SSE-S3 / AES256, bucket keys enabled)
#   - Versioning enabled
#   - ACLs disabled (BucketOwnerEnforced)
#   - Bucket policy denies any request not using TLS
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: data-eu-north-1
  namespace: ack-system
  annotations:
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: krops-120392301094-eu-north-1-workload-data
  createBucketConfiguration:
    locationConstraint: eu-north-1
  publicAccessBlock:
    blockPublicACLs: true
    blockPublicPolicy: true
    ignorePublicACLs: true
    restrictPublicBuckets: true
  encryption:
    rules:
      - applyServerSideEncryptionByDefault:
          sseAlgorithm: AES256
        bucketKeyEnabled: true
  versioning:
    status: Enabled
  ownershipControls:
    rules:
      - objectOwnership: BucketOwnerEnforced
  policy: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "DenyInsecureTransport",
          "Effect": "Deny",
          "Principal": "*",
          "Action": "s3:*",
          "Resource": [
            "arn:aws:s3:::krops-120392301094-eu-north-1-workload-data",
            "arn:aws:s3:::krops-120392301094-eu-north-1-workload-data/*"
          ],
          "Condition": {
            "Bool": { "aws:SecureTransport": "false" }
          }
        }
      ]
    }
  tagging:
    tagSet:
      - key: managed-by
        value: flux-ack
      - key: cluster
        value: eu-north-1-workload
---
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: data-eu-west-1
  namespace: ack-system
  annotations:
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/region: eu-west-1
spec:
  name: krops-120392301094-eu-west-1-workload-data
  createBucketConfiguration:
    locationConstraint: eu-west-1
  publicAccessBlock:
    blockPublicACLs: true
    blockPublicPolicy: true
    ignorePublicACLs: true
    restrictPublicBuckets: true
  encryption:
    rules:
      - applyServerSideEncryptionByDefault:
          sseAlgorithm: AES256
        bucketKeyEnabled: true
  versioning:
    status: Enabled
  ownershipControls:
    rules:
      - objectOwnership: BucketOwnerEnforced
  policy: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "DenyInsecureTransport",
          "Effect": "Deny",
          "Principal": "*",
          "Action": "s3:*",
          "Resource": [
            "arn:aws:s3:::krops-120392301094-eu-west-1-workload-data",
            "arn:aws:s3:::krops-120392301094-eu-west-1-workload-data/*"
          ],
          "Condition": {
            "Bool": { "aws:SecureTransport": "false" }
          }
        }
      ]
    }
  tagging:
    tagSet:
      - key: managed-by
        value: flux-ack
      - key: cluster
        value: eu-west-1-workload

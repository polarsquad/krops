---
# ══════════════════════════════════════════════════════════════════════════════
# Per-cluster resource for swedencentral-workload: the data resource group
# (the S3/RDS "account" boundary in AWS terms). It is the owner boundary for
# the management-side workload resources in
# infrastructure/workload-resources/swedencentral-*.yaml (referenced by ARM
# ID, so no cross-namespace owner).
#
# The workload ASO's identity chain (workload UAMI, federated credential,
# Contributor role assignment) was removed with the workload release in
# issue #559: the CRs now act as krops-capz through aso-credentials.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: resources.azure.com/v1api20200601
kind: ResourceGroup
metadata:
  name: krops-swedencentral-workload-data
  namespace: default
  annotations:
    serviceoperator.azure.com/credential-from: aso-credentials
spec:
  location: ${AZURE_LOCATION}
  tags:
    managed-by: flux-aso
    cluster: swedencentral-workload

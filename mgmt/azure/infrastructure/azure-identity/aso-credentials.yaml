---
# ══════════════════════════════════════════════════════════════════════════════
# Credential for the bundled ASO (management side), referenced by the
# `credential-from` annotation on every management-side ASO resource and by the
# AzureClusterIdentity. Secret-free (issue #236): workload identity. ASO
# exchanges the projected token of its service account
# (capz-system/azureserviceoperator-default) for the krops-capz UAMI.
# Plain on purpose: nothing here is sensitive, so it is committed unencrypted
# and applied to the pivot target via pivot-manifests (bootstrap.toml).
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: aso-credentials
  namespace: default
type: Opaque
stringData:
  AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID}"
  AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
  AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
  USE_WORKLOAD_IDENTITY_AUTH: "true"

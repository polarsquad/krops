apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# aso-credentials.yaml is a plain (secret-free) Secret, committed
# unencrypted: workload identity (issue #236), so no SOPS decryption is
# needed for this path. azure-vars.yaml carries the non-secret IDs used by
# postBuild substitution (like AWS_ACCOUNT_ID in aws).
resources:
  - azure-vars.yaml
  - cluster-identity.yaml
  - aso-credentials.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# aso-credentials.yaml is a plain (secret-free) Secret, committed
# unencrypted: workload identity (issue #236), so no SOPS decryption is
# needed for this path. azure-vars.yaml is applied by the root mgmt/azure
# sync (issue #507): every Kustomization that substitutes from it,
# including this one, needs the ConfigMap to exist before Flux builds it.
resources:
  - cluster-identity.yaml
  - aso-credentials.yaml

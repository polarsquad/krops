---
# ══════════════════════════════════════════════════════════════════════════════
# Secure-by-default storage account + blob container for swedencentral-workload
# (the S3 bucket's counterpart in
# mgmt/aws/infrastructure/workload-resources/bucket.yaml), reconciled by the
# ASO bundled with CAPZ on THIS (management) cluster through the
# aso-credentials Secret (krops-capz).
# Posture:
#   - no anonymous blob access, HTTPS only, TLS 1.2 minimum
#   - shared-key (account key) access disabled: Entra ID authorization only
#   - blob versioning + 7-day soft delete
#   - Microsoft-managed encryption at rest (default)
# Account names are globally unique and 3-24 lowercase alphanumerics, so the
# name is a committed literal (it is also a committed literal in the
# flux-apps region cluster-vars, which no longer consumes it).
#
# One file per workload cluster (swedencentral-*.yaml); copy for a future
# region, as in aso-workload-identity/.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: storage.azure.com/v1api20230101
kind: StorageAccount
metadata:
  name: data
  namespace: default
  annotations:
    serviceoperator.azure.com/credential-from: aso-credentials
spec:
  azureName: kropsswcworkloadsksimc
  location: ${AZURE_LOCATION}
  owner:
    armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/krops-swedencentral-workload-data
  kind: StorageV2
  sku:
    name: Standard_LRS
  accessTier: Hot
  allowBlobPublicAccess: false
  allowSharedKeyAccess: false
  supportsHttpsTrafficOnly: true
  minimumTlsVersion: TLS1_2
  tags:
    managed-by: flux-aso
    cluster: swedencentral-workload
---
apiVersion: storage.azure.com/v1api20230101
kind: StorageAccountsBlobService
metadata:
  name: data-blob
  namespace: default
  annotations:
    serviceoperator.azure.com/credential-from: aso-credentials
spec:
  owner:
    name: data
  isVersioningEnabled: true
  deleteRetentionPolicy:
    enabled: true
    days: 7
---
apiVersion: storage.azure.com/v1api20230101
kind: StorageAccountsBlobServicesContainer
metadata:
  name: data
  namespace: default
  annotations:
    serviceoperator.azure.com/credential-from: aso-credentials
spec:
  azureName: data
  owner:
    name: data-blob
  publicAccess: None

---
# ══════════════════════════════════════════════════════════════════════════════
# Per-cluster FluxInstance ConfigMaps for the GCP workload clusters, applied
# by the ClusterResourceSet below (same mechanism as mgmt/aws/addons/).
#
# cluster-vars feeds postBuild substitution on the workload cluster:
#   GCP_* IDs come from `mise -E gcp run gcp-bootstrap`; CLUSTER_NAME and
#   GCP_NETWORK are literals (the VPC CAPG creates, the bucket/SQL/PSA
#   resource names are derived from these in workload/gcp-base/).
#   GCP_PROJECT / GCP_PROJECT_NUMBER are also in
#   mgmt/gcp/infrastructure/gcp-vars/gcp-vars.yaml; after gcp-bootstrap runs,
#   update both files together (docs/gcp.md, "Commit the identifiers").
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-instance-europe-north1
  namespace: default
data:
  flux-instance.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-vars
      namespace: flux-system
    data:
      GCP_REGION: "europe-north1"
      CLUSTER_NAME: "europe-north1-workload"
      GCP_PROJECT: "krops-placeholder"
      GCP_PROJECT_NUMBER: "000000000000"
      GCP_NETWORK: "krops-europe-north1-workload"
    ---
    apiVersion: fluxcd.controlplane.io/v1
    kind: FluxInstance
    metadata:
      name: flux
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcileEvery: "1h"
        fluxcd.controlplane.io/reconcileTimeout: "5m"
    spec:
      distribution:
        version: "2.x"
        registry: "ghcr.io/fluxcd"
        artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      cluster:
        type: kubernetes
        size: small
        multitenant: false
        networkPolicy: true
        domain: "cluster.local"
      sync:
        kind: GitRepository
        url: "https://github.com/polarsquad/krops"
        ref: "refs/heads/main"
        path: "workload/europe-north1-01"
        pullSecret: "flux-github-pat"
---
apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: flux-instance-europe-north1
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      fluxcd: enabled
      region: europe-north1
  strategy: ApplyOnce
  resources:
    - kind: ConfigMap
      name: flux-instance-europe-north1
    - kind: Secret
      name: flux-pull-secret

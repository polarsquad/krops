---
# ── GKE management Cluster ──────────────────────────────────────────────────
# Created by CAPG in the kind bootstrap cluster, moved by `clusterctl move`
# (pivot), then reconciled from Git by the Flux instance inside it. Same
# lifecycle as mgmt/aws/clusters/eu-north-1/management/.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: management
  namespace: default
  labels:
    region: europe-north1
    # Deliberately NOT `fluxcd: enabled` (see the aws management cluster).
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"]
  controlPlaneRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: GCPManagedControlPlane
    name: management-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: GCPManagedCluster
    name: management
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: GCPManagedCluster
metadata:
  name: management
  namespace: default
spec:
  project: ${GCP_PROJECT}
  region: europe-north1
  network:
    # Literal final name: CAPG creates this VPC (auto mode).
    name: krops-europe-north1-management
    autoCreateSubnetworks: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: GCPManagedControlPlane
metadata:
  name: management-control-plane
  namespace: default
spec:
  project: ${GCP_PROJECT}
  # Zonal: the first zonal cluster per billing account carries no
  # control-plane fee. The WIF `mgmt` provider's issuer URL embeds this
  # location and clusterName (infrastructure/kcc-identity/pool.yaml).
  location: europe-north1-a
  clusterName: krops-europe-north1-management
  # Newest REGULAR-channel validVersion from `gcloud container
  # get-server-config --location europe-north1-a` (acceptance run).
  version: "1.36.4-gke.1495002"
  releaseChannel: regular
  clusterSecurity:
    workloadIdentityConfig:
      workloadPool: ${GCP_PROJECT}.svc.id.goog
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: management-pool
  namespace: default
spec:
  clusterName: management
  replicas: 2
  template:
    spec:
      clusterName: management
      bootstrap:
        dataSecretName: ""
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: GCPManagedMachinePool
        name: management-pool
      version: "1.36.4-gke.1495002"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: GCPManagedMachinePool
metadata:
  name: management-pool
  namespace: default
spec:
  # Cheapest GKE Standard type that fits the system pods (2 shared vCPU, 4 GiB).
  machineType: e2-medium
  diskSizeGb: 50
  diskType: pd-standard
  nodeLocations:
    - europe-north1-a
  management:
    autoRepair: true
    autoUpgrade: false

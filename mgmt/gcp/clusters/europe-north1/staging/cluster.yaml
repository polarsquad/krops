---
# ── GKE workload Cluster ────────────────────────────────────────────────────
# Reconciled by this management cluster's Flux once the workload cluster is
# up; its own Flux instance then syncs workload/europe-north1-01 (delivered
# by the flux-apps ResourceSet in mgmt/gcp/addons/).
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: workload
  namespace: default
  labels:
    fluxcd: enabled
    region: europe-north1
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"]
  controlPlaneRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: GCPManagedControlPlane
    name: workload-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: GCPManagedCluster
    name: workload
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: GCPManagedCluster
metadata:
  name: workload
  namespace: default
spec:
  project: ${GCP_PROJECT}
  region: europe-north1
  network:
    # Literal final name: CAPG creates this VPC (auto mode). Cloud SQL's
    # private IP peers into this VPC (workload/gcp-base/networking/).
    name: krops-europe-north1-workload
    autoCreateSubnetworks: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: GCPManagedControlPlane
metadata:
  name: workload-control-plane
  namespace: default
spec:
  project: ${GCP_PROJECT}
  location: europe-north1-a
  clusterName: krops-europe-north1-workload
  # Placeholder until `gcloud container get-server-config --location
  # europe-north1-a` is run against the real project (acceptance run).
  version: "1.33.4-gke.1234000"
  releaseChannel: regular
  clusterSecurity:
    workloadIdentityConfig:
      # GKE-native Workload Identity for the workload-cluster Config Connector
      # (krops-kcc, bound in infrastructure/kcc-identity/europe-north1-workload.yaml).
      workloadPool: ${GCP_PROJECT}.svc.id.goog
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: workload-system
  namespace: default
spec:
  clusterName: workload
  replicas: 1
  template:
    spec:
      clusterName: workload
      bootstrap:
        dataSecretName: ""
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: GCPManagedMachinePool
        name: workload-system
      version: "1.33.4-gke.1234000"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: GCPManagedMachinePool
metadata:
  name: workload-system
  namespace: default
spec:
  machineType: e2-medium
  diskSizeGb: 50
  diskType: pd-standard
  nodeLocations:
    - europe-north1-a
  management:
    autoRepair: true
    autoUpgrade: false
---
# ── ARM user pool (the aws/azure Arm pool's counterpart) ────────────────────
# OMITTED pending spike S4 (arm machine-type availability in europe-north1-a),
# which requires an authenticated gcloud and runs during the acceptance phase:
#   gcloud compute machine-types list --zones europe-north1-a \
#     --filter="name~'^(c4a|t2a)'"
# If it returns a type, add a workload-arm MachinePool + GCPManagedMachinePool
# here (machineType c4a-standard-2 or t2a-standard-2, replicas 2,
# kubernetesLabels: {node.kubernetes.io/arch: arm64}), mirroring
# mgmt/azure/clusters/swedencentral/staging/cluster.yaml's workload-arm pool.

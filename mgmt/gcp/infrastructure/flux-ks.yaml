---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gcp-vars
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/gcp-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-operator
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/capi-operator
  dependsOn:
    - name: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc-operator
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # wait for the operator StatefulSet to be Ready so the kcc Kustomization's
  # ConfigConnector CR lands on a live operator.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/kcc-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # No wait: the ConfigConnector CR has no standard ready condition.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/kcc
  dependsOn:
    - name: kcc-operator
    - name: gcp-vars
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
      # kind bootstrap cluster only (wif-federate creates it): sets
      # GCP_WIF_PROVIDER=kind. Listed after gcp-vars so it overrides.
      - kind: ConfigMap
        name: gcp-wif
        optional: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc-identity
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # No wait: the KCC-managed CRs (Service, IAM*, IAMWorkloadIdentityPool*)
  # have no standard ready condition; KCC's own actuation is the readiness
  # signal, observed by test-gcp-identity-chain.py and the acceptance run.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/kcc-identity
  dependsOn:
    - name: kcc
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
---
# ── workload cloud resources (issue #560: moved off the workload cluster) ───
# The four Kustomizations below own the GCP resources each workload GKE
# used to run its own Config Connector for (workload/gcp-base/): they now
# reconcile on the management cluster's KCC, which acts as krops-capg.
# dependsOn: kcc-identity transitively orders them after kcc-operator and
# kcc, and after krops-capg's project grants (the three admin roles the
# moved CRs need) are managed. KCC reports readiness on managed resources
# via status.conditions, so wait: true blocks until each resource is
# actually created.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # wait: the PSA range + peering must actually exist before postgres
  # (privateNetworkRef target).
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/workload-resources/networking
  dependsOn:
    - name: kcc-identity
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  # wait: the bucket must exist before the iam Kustomization's
  # objectViewer grant references it.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/workload-resources/storage
  dependsOn:
    - name: kcc-identity
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 30m
  prune: true
  # wait: instance creation takes 10-20 min; iam's instanceUser grant
  # and the SQLUser both reference the instance.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/workload-resources/postgres
  dependsOn:
    - name: kcc-identity
    - name: networking
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iam
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  # wait: the reader GSA and its grants must exist before the human
  # krops-reader flow can use them.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/workload-resources/iam
  dependsOn:
    - name: kcc-identity
    - name: storage
    - name: postgres
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars

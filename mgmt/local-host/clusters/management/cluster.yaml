apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: local-management
  namespace: default
  labels:
    # environment=local-host makes the kindnet ClusterResourceSet supply the
    # CNI (CAPD clusters ship none). The management cluster is not listed in
    # spec.inputs of the flux-apps ResourceSet
    # (mgmt/local-host/addons/flux-apps/flux-apps-rset.yaml), and fluxcd:
    # enabled is deliberately absent: the flux-operator HelmChartProxy would
    # compete with the bootstrap-installed release.
    krops.polarsquad.com/environment: local-host
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
        - 10.128.0.0/12
  topology:
    classRef:
      name: docker-management
    version: v1.36.4
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
        - class: default-worker
          name: md-0
          replicas: 1

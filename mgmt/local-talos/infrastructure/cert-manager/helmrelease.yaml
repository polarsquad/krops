apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
      # renovate: datasource=helm registryUrl=https://charts.jetstack.io depName=cert-manager
      version: "1.21.2"
  values:
    crds:
      enabled: true

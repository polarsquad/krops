min_version = "2026.9.2"

[tools]
go = "1.27.1"
kubectl = "1.37.0"
python = "3.14.7"
kind = "0.33.0"
helm = "4.2"
clusterctl = "1.14.1"
flux2 = "2.9.4"
sops = "3.13.3"
age = "1.3.2"
uv = "0.12.11"

# Zarf CLI (airgap prototype). The mise github backend downloads the raw
# release asset and keeps its original filename, so we select the native
# Linux/macOS arm64 asset and use `bin` to name the binary `zarf`.
[tools."github:zarf-dev/zarf"]
version = "v0.85.0"
asset_pattern = 'zarf_v{{ version }}_{{ os(linux="Linux", macos="Darwin") }}_{{ arch() }}'
bin = "zarf"

[settings]
env_file = ".env"

[tasks.validate]
description = "Check scripts and air-gap image pins, cross-check bootstrap config, and build every kustomize overlay"
run = '''
fail=0
for script in bootstrap.sh bootstrap-common.sh pivot.sh teardown.sh; do
  echo "==> bash -n $script"
  if ! bash -n "$script"; then
    echo "    FAILED: $script" >&2
    fail=1
  fi
done
echo "==> air-gap image digest pins"
if ! python3 airgap/tests/test-airgap-image-digests.py; then
  echo "    FAILED: air-gap image digest pins" >&2
  fail=1
fi
echo "==> bootstrap.toml cross-check"
if ! python3 tests/test-bootstrap-config.py; then
  echo "    FAILED: bootstrap.toml cross-check" >&2
  fail=1
fi
echo "==> azure identity chain"
if ! uv run python tests/test-azure-identity-chain.py; then
  echo "    FAILED: azure identity chain" >&2
  fail=1
fi
for dir in $(find mgmt workload -name kustomization.yaml -exec dirname {} \; | sort -u); do
  echo "==> kustomize build $dir"
  if ! kubectl kustomize "$dir" >/dev/null; then
    echo "    FAILED: $dir" >&2
    fail=1
  fi
done
exit $fail
'''

[tasks.sops-keygen]
description = "Generate an age keypair (age.agekey) for SOPS; prints the public key"
run = """
if [ -f age.agekey ]; then
  echo "age.agekey already exists — refusing to overwrite. Delete it first to regenerate." >&2
  exit 1
fi
age-keygen -o age.agekey
echo
PUBLIC_KEY=$(age-keygen -p age.agekey 2>/dev/null | head -1)
echo "Public key: $PUBLIC_KEY"
echo "Add this public key to the 'age:' field in .sops.yaml, then run: mise run sops-updatekeys"
"""

[tasks.sops-encrypt]
description = "Encrypt a *.sops.yaml manifest in place (usage: mise run sops-encrypt <file>)"
run = "sops --encrypt --in-place --input-type yaml --output-type yaml"

[tasks.sops-decrypt]
description = "Decrypt a *.sops.yaml manifest to stdout (usage: mise run sops-decrypt <file>)"
run = "sops --decrypt --input-type yaml --output-type yaml"

[tasks.sops-updatekeys]
description = "Re-encrypt all *.sops.yaml files to match recipients in .sops.yaml"
run = """
for f in $(find mgmt -name '*.sops.yaml'); do
  echo "==> updatekeys $f"
  sops updatekeys --yes "$f"
done
"""

[tasks.bootstrap]
description = "Bootstrap the management kind cluster, hand off to Flux/GitOps, then pivot to the self-managed management cluster (toolbox container; native path: ./bootstrap.sh)"
run = "scripts/toolbox-run.sh bootstrap"

[tasks.pivot]
description = "Pivot the management cluster from local kind to the CAPI-managed management cluster (aws=CAPA/EKS, local-host=CAPD) (toolbox container; native path: ./pivot.sh)"
run = "scripts/toolbox-run.sh pivot"

[tasks.mgmt-kubeconfig]
description = "Export the management-cluster kubeconfig to ~/.kube/krops-mgmt.yaml"
run = '''
MGMT_CLUSTER="${MGMT_CLUSTER:-$(case "${KROPS_PROFILE:-aws}" in local-host) echo local-management;; local-talos) echo local-talos-management;; azure) echo swedencentral-management;; *) echo eu-north-1-management;; esac)}"
MGMT_KUBECONFIG="${MGMT_KUBECONFIG:-$HOME/.kube/krops-mgmt.yaml}"
clusterctl get kubeconfig "$MGMT_CLUSTER" -n default > "$MGMT_KUBECONFIG"
chmod 600 "$MGMT_KUBECONFIG"
if [ "${KROPS_PROFILE:-aws}" = local-host ]; then
  # CAPD records the load balancer's container-network IP, which is not
  # routable from macOS. Point at the port published on localhost instead.
  engine="${CONTAINER_ENGINE:-docker}"
  endpoint="$($engine port "${MGMT_CLUSTER}-lb" 6443/tcp | head -1)"
  port="${endpoint##*:}"
  case "$port" in
    ''|*[!0-9]*)
      echo "ERROR: cannot determine the ${MGMT_CLUSTER} API server port" >&2
      exit 1
      ;;
  esac
  kubectl config set-cluster "$MGMT_CLUSTER" \
    --server="https://127.0.0.1:${port}" \
    --kubeconfig="$MGMT_KUBECONFIG" >/dev/null
fi
kubectl --kubeconfig "$MGMT_KUBECONFIG" config rename-context \
  "$(kubectl --kubeconfig "$MGMT_KUBECONFIG" config current-context)" \
  krops-mgmt >/dev/null
echo "Wrote ${MGMT_KUBECONFIG}"
echo "Use with: KUBECONFIG=${MGMT_KUBECONFIG} kubectl get clusters"
'''

[tasks.aws-credentials]
description = "Export AWS credentials as a profile string for SOPS-encrypted secrets"
run = "clusterawsadm bootstrap credentials encode-as-profile"

[tasks.teardown]
description = "Tear down all infrastructure created by bootstrap (toolbox container; native path: ./teardown.sh)"
run = "scripts/toolbox-run.sh teardown"

[tasks.docs-assemble]
description = "Copy README.md + docs/ into build/docs with rewritten links"
run = "uv run python tools/assemble_docs.py"

[tasks.docs-test]
description = "Unit tests for the docs assembler"
run = "uv run pytest -q"

[tasks.docs-build]
description = "Assemble and strict-build the static site into build/site"
depends = ["docs-assemble"]
run = "uv run mkdocs build --strict"

[tasks.docs-serve]
description = "Assemble and serve the docs site with live reload"
depends = ["docs-assemble"]
run = "uv run mkdocs serve"

[project]
name = "krops-site"
version = "0.0.0"
description = "Documentation website build for krops (GitHub Pages)"
requires-python = "==3.15.1"
dependencies = [
  "mkdocs-material==9.8.0",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.ruff.lint]
# F401: unused imports. PLW1510: subprocess.run() must state check= explicitly
# (the default silently swallows non-zero exit codes). Not a general style
# linter for this repo.
select = ["F401", "PLW1510"]

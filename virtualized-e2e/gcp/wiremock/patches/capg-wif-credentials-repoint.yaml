# Merge patch: repoint CAPG's WIF credential at WireMock (issue #355).
#
# Target: secret/capg-wif-credentials, namespace capg-system (the harness
# applies the repo's Secret first; this patch replaces the credentials.json
# string wholesale). Apply with:
#   kubectl patch secret capg-wif-credentials -n capg-system \
#     --type merge --patch-file virtualized-e2e/gcp/wiremock/patches/capg-wif-credentials-repoint.yaml
#
# Mechanism (the #355 Phase 1 GCP auth shortcut): token_url and
# service_account_impersonation_url point at the WireMock Service directly,
# so the external_account STS exchange and the impersonation call land at
# WireMock without any DNS interception of sts/iamcredentials.googleapis.com.
# WireMock answers both with the boot stubs in stubs-configmap.yaml. Every
# other value is a dummy: the harness has no GCP project, no WIF pool, and
# no real credentials, and WireMock does not validate the subject token.
# credential_source stays the projected service account token, which exists
# in the pod regardless. The manager trusts the WireMock TLS endpoint
# through the wiremock-ca ConfigMap (capg-controller-manager.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: capg-wif-credentials
  namespace: capg-system
stringData:
  credentials.json: |
    {
      "type": "external_account",
      "audience": "//iam.googleapis.com/projects/000000000000/locations/global/workloadIdentityPools/krops/providers/wiremock",
      "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
      "token_url": "https://wiremock.wiremock-system.svc/v1/token",
      "service_account_impersonation_url": "https://wiremock.wiremock-system.svc/v1/projects/-/serviceAccounts/krops-capg@wiremock-dummy.iam.gserviceaccount.com:generateAccessToken",
      "credential_source": {
        "file": "/var/run/secrets/kubernetes.io/serviceaccount/token"
      }
    }

# Merge patch: repoint KCC's WIF credential at WireMock (issue #355).
#
# Target: secret/kcc-wif-credentials, namespace cnrm-system (the harness
# applies the repo's Secret first; this patch replaces the key.json string
# wholesale; the ConfigConnector mounts it at /var/secrets/google/key.json).
# Apply with:
#   kubectl patch secret kcc-wif-credentials -n cnrm-system \
#     --type merge --patch-file virtualized-e2e/gcp/wiremock/patches/kcc-wif-credentials-repoint.yaml
#
# Mechanism: identical to capg-wif-credentials-repoint.yaml; see that
# file's header. KCC's Google calls run through the Terraform provider
# processes cnrm-controller-manager spawns, which inherit its environment,
# so the CA trust patch on the controller covers them.
apiVersion: v1
kind: Secret
metadata:
  name: kcc-wif-credentials
  namespace: cnrm-system
stringData:
  key.json: |
    {
      "type": "external_account",
      "audience": "//iam.googleapis.com/projects/000000000000/locations/global/workloadIdentityPools/krops/providers/wiremock",
      "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
      "token_url": "https://wiremock.wiremock-system.svc/v1/token",
      "service_account_impersonation_url": "https://wiremock.wiremock-system.svc/v1/projects/-/serviceAccounts/krops-capg@wiremock-dummy.iam.gserviceaccount.com:generateAccessToken",
      "credential_source": {
        "file": "/var/run/secrets/kubernetes.io/serviceaccount/token"
      }
    }

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aso
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  # wait: true so the resource Kustomizations below only apply once the ASO
  # CRDs and controller are Ready.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/azure-base/aso
  dependsOn:
    - name: cert-manager
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars

---
# ══════════════════════════════════════════════════════════════════════════════
# cert-manager on the workload cluster. Kept as the thin-workload-root
# component per issue #559 (the workload-side ASO it existed for is gone;
# the Azure resources now reconcile on the management cluster). wait: true
# so the Kustomization only reports ready once the CA injector is Ready.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/azure-base/cert-manager

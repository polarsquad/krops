---
# ══════════════════════════════════════════════════════════════════════════════
# Flux Kustomization: the per-cluster reader service account and its grants.
# dependsOn: storage so the bucket the objectViewer grant references exists
# first, and postgres so the SQLUser the instanceUser grant serves exists
# (and after kcc for the CRDs).
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iam
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/gcp-base/iam
  dependsOn:
    - name: kcc
    - name: storage
    - name: postgres
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars

---
# ══════════════════════════════════════════════════════════════════════════════
# Per-cluster read-only identity (issue #72, the AWS IAM reader-role and
# mgmt/aws/infrastructure/workload-resources/roles.yaml counterparts). A
# service account per cluster with
# storage.objectViewer on this cluster's bucket and cloudsql.instanceUser on
# the project (the IAM-database-auth login role, which carries
# cloudsql.instances.login), plus a token-creator grant ON this per-cluster
# account whose member is the project-level human `krops-reader` GSA: the
# human identity can impersonate the per-cluster reader and read the bucket /
# database through it (least privilege per cluster, like the AWS reader role).
#
# accountId length: GCP caps service account IDs at 30 characters. The full
# cluster name is 22 chars, so `krops-${CLUSTER_NAME}-r` is 30 and is the
# longest reader-style name that fits (`-reader` is 35, `-rd` is 31). The
# identity chain test asserts the length so a longer cluster name fails the
# gate instead of the GCP API.
#
# dependsOn: storage so the bucket the viewer grant references exists first.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: iam.cnrm.cloud.google.com/v1
kind: IAMServiceAccount
metadata:
  name: krops-reader
  namespace: default
spec:
  accountId: "krops-${CLUSTER_NAME}-r"
  displayName: "krops reader (${CLUSTER_NAME})"
---
apiVersion: iam.cnrm.cloud.google.com/v1
kind: IAMPolicyMember
metadata:
  name: krops-reader-bucket-viewer
  namespace: default
spec:
  role: "roles/storage.objectViewer"
  member: "serviceAccount:krops-${CLUSTER_NAME}-r@${GCP_PROJECT}.iam.gserviceaccount.com"
  resourceRef:
    kind: StorageBucket
    name: data
---
# cloudsql.instanceUser is the IAM database-auth login role (it carries
# cloudsql.instances.login plus get/executeSql). The per-cluster GSA is the
# SQLUser in postgres/, so it needs this to log in at all. The original
# cloudsql.viewer grant (read access to the instance in the console/API)
# is kept alongside it.
apiVersion: iam.cnrm.cloud.google.com/v1
kind: IAMPolicyMember
metadata:
  name: krops-reader-sql-viewer
  namespace: default
spec:
  role: "roles/cloudsql.viewer"
  member: "serviceAccount:krops-${CLUSTER_NAME}-r@${GCP_PROJECT}.iam.gserviceaccount.com"
  resourceRef:
    external: "projects/${GCP_PROJECT}"
---
apiVersion: iam.cnrm.cloud.google.com/v1
kind: IAMPolicyMember
metadata:
  name: krops-reader-sql-instance-user
  namespace: default
spec:
  role: "roles/cloudsql.instanceUser"
  member: "serviceAccount:krops-${CLUSTER_NAME}-r@${GCP_PROJECT}.iam.gserviceaccount.com"
  resourceRef:
    external: "projects/${GCP_PROJECT}"
---
# The human's impersonation path: token creator on the reader's own account.
apiVersion: iam.cnrm.cloud.google.com/v1
kind: IAMPolicyMember
metadata:
  name: krops-reader-token-creator
  namespace: default
spec:
  role: "roles/iam.serviceAccountTokenCreator"
  member: "serviceAccount:krops-reader@${GCP_PROJECT}.iam.gserviceaccount.com"
  resourceRef:
    kind: IAMServiceAccount
    name: krops-reader

---
# ══════════════════════════════════════════════════════════════════════════════
# Flux Kustomization: the workload-cluster Config Connector operator.
# wait: true so the kcc Kustomization's ConfigConnector CR only lands once
# the operator StatefulSet is Ready (the management-side kcc-operator
# precedent). The Helm chart ships its own webhook certs, so there is no
# cert-manager dependency on the workload cluster.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/gcp-base/kcc-operator

---
# ══════════════════════════════════════════════════════════════════════════════
# Flux Kustomization: the workload-cluster Config Connector CR (the operator
# lives in the kcc-operator Kustomization). No wait: the ConfigConnector CR
# has no standard ready condition the Kustomization can observe, so this
# Kustomization completes on apply and the resource Kustomizations below
# (networking, storage, postgres, iam) order after the operator via
# dependsOn: kcc-operator.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/gcp-base/kcc
  dependsOn:
    - name: kcc-operator
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        # optional: cluster-vars is bootstrapped onto the workload cluster via
        # remote-apply (ResourceSet); the diff renderer cannot trace that
        # cross-cluster path so it cannot verify the ConfigMap exists at render
        # time. In practice it is always present before this Kustomization runs.
        optional: true

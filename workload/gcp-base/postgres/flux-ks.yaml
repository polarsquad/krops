---
# ══════════════════════════════════════════════════════════════════════════════
# Flux Kustomization: the workload cluster's Cloud SQL instance (private IP,
# IAM auth). dependsOn: networking so the PSA range + VPC peering
# (the privateNetworkRef target) exists before the instance is created.
# timeout: 30m because instance creation takes 10-20 min.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 30m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/gcp-base/postgres
  dependsOn:
    - name: kcc
    - name: networking
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars

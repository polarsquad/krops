---
# ══════════════════════════════════════════════════════════════════════════════
# Application database (issue #72, the RDS and PostgreSQL Flexible Server
# counterparts). Cloud SQL PostgreSQL 17, zonal, private IP only (no public
# address; the private IP peers into the workload VPC through the PSA range
# in networking/), IAM database authentication for the reader user, TLS required.
# No rootPassword: the built-in postgres user is created passwordless and cannot log in; see docs/gcp.md (Known limitations).
#
# settings.diskType PD_HDD + db-f1-micro keep the default bill small; the
# tier is a documented knob, not a pin. deletionProtectionEnabled stays
# false so teardown can delete the instance (the manual teardown procedure
# in bootstrap.toml lists it).
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: app-db
  namespace: default
spec:
  resourceID: "krops-${CLUSTER_NAME}-db"
  region: "${GCP_REGION}"
  databaseVersion: POSTGRES_17
  deletionProtectionEnabled: false
  settings:
    edition: ENTERPRISE
    tier: "db-f1-micro"
    availabilityType: ZONAL
    diskSize: 10
    diskType: PD_HDD
    ipConfiguration:
      ipv4Enabled: false
      sslMode: ENCRYPTED_ONLY
      privateNetworkRef:
        external: "projects/${GCP_PROJECT}/global/networks/${GCP_NETWORK}"
    databaseFlags:
      - name: "cloudsql.iam_authentication"
        value: "on"
    backupConfiguration:
      enabled: true
---
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLDatabase
metadata:
  name: app
  namespace: default
spec:
  charset: "UTF8"
  collation: ""
  instanceRef:
    name: app-db
  resourceID: "app"
---
# Per-cluster reader service account (iam/ creates it and grants it
# storage.objectViewer on the bucket and cloudsql.instanceUser on the
# project). CLOUD_IAM_SERVICE_ACCOUNT users authenticate with IAM: no
# password stored, no password rotated.
#
# PostgreSQL IAM user names must omit the .gserviceaccount.com suffix (the
# username is the SA email truncated at the length limit; GCP docs + the
# Terraform provider both require the .iam form), and `host` is not a
# supported field for PostgreSQL instances (MySQL only).
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLUser
metadata:
  name: app-db-reader
  namespace: default
spec:
  instanceRef:
    name: app-db
  resourceID: "krops-${CLUSTER_NAME}-r@${GCP_PROJECT}.iam"
  type: CLOUD_IAM_SERVICE_ACCOUNT
